<div class="center">
  <mat-card>
    <mat-card-title>Schnell-Schnell Login Form</mat-card-title>
    <mat-card-content>
      <form [formGroup]="form" (click)="login()">
        <mat-form-field>
          <input
            type="text"
            matInput
            placeholder="Username"
            formControlName="username"
          />
        </mat-form-field>
        <mat-form-field>
          <input
            type="password"
            matInput
            placeholder="Password"
            formControlName="password"
          />
        </mat-form-field>

        <div class="button">
          <button mat-raised-button color="primary">Login</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
